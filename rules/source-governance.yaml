# Source, conflict, and validation rules for govern-and-validate-research-evidence.
# This is the single authoritative definition. The Skill and the script both read
# this one file and this one rule_version; neither copies these rules nor adds a
# rule DSL/plugin mechanism. Tables are fixed and case-specific to Snapshot v3.
rule_version: smic-v3-source-governance-v1
snapshot_id: smic-a283e95e2c9e8068

