# Record-level tier override inside T3 transcripts: the AlphaSpread AI summary block
# is a machine-generated third-party rewrite, downgraded to T4.
record_tier_overrides:
  ai_summary_downgrade:
    to_tier: T4
    applies_when_speaker_in:
      - ALPHASPREAD_AI_SUMMARY
    applies_when_section_startswith: "AI Summary"

# ---------------------------------------------------------------------------
# claim_type rules. material_category is evaluated BEFORE record_kind so that numeric
# records inside a transcript still receive management/third-party judgement instead of
# being read as REPORTED_FACT. ANALYTIC_INFERENCE is not produced in this stage (count 0).
# ---------------------------------------------------------------------------
claim_type_rules:
  transcript:
    ai_summary: THIRD_PARTY_VIEW      # speaker ALPHASPREAD_AI_SUMMARY / "AI Summary" section
    host_operator: THIRD_PARTY_VIEW   # speaker OPERATOR
    management_forward_looking: MANAGEMENT_GUIDANCE
    management_other: MANAGEMENT_ASSERTION
    host_operator_speakers:
      - OPERATOR
  industry_association: THIRD_PARTY_VIEW
  designated_media_full_text: REPORTED_FACT
  issuer_statutory_disclosure:
    numeric: REPORTED_FACT
    derived: DERIVED_METRIC   # value_origin other than SOURCE_REPORTED (none in v3)
    text: REPORTED_FACT
  # Forward-looking / uncertainty markers that split management speech into
  # GUIDANCE vs ASSERTION. Structural signals (non-null target_period, period_nature
  # FUTURE, or non-null uncertainty_text) also mark GUIDANCE.
  forward_looking_markers:
    - expect
    - anticipate
    - outlook
    - guidance
    - forecast
    - "next quarter"
    - "coming quarter"
    - "full year"
    - "full-year"
    - "second half"
    - "going forward"
    - 预计
    - 预期
    - 指引
    - 展望
    - 有望
    - 目标
    - 计划
    - 将会
    - 未来

# ---------------------------------------------------------------------------
# Evidence status. Three-value enum decided by short-circuit priority
# QUARANTINED > RESTRICTED > USABLE. There is no separate can_support_bearing_finding
# boolean (that is exactly the USABLE meaning). permitted_use is derived from status.
# ---------------------------------------------------------------------------
evidence_status:
  priority: [QUARANTINED, RESTRICTED, USABLE]
  quarantined_when:
    material_as_of_ineligible: true
    content_locator_unresolvable: true      # empty locator or material not parsed/missing
    normalization_status_blocked: true      # normalization_status == BLOCKED
  restricted_when:
    normalization_status_partial: true      # normalization_status == PARTIAL
    tier_in: [T3, T4]
    conflict_unresolved: true               # conflicting parties stay presentable, not isolated
  permitted_use:
    USABLE: CITE_AND_BEAR
    RESTRICTED: CITE_ONLY
    QUARANTINED: NOT_USABLE

# source_use_note_status only records whether the frozen material carried known
# limitations. It is recorded for the FR-043 check and never changes evidence_status;
# there is no PROHIBITED status.
source_use_note:
  status_values: [RECORDED, RECORDED_WITH_LIMITATIONS]
  limitation_note_keys: [known_limitations, limitations, limitation]

# ---------------------------------------------------------------------------
# Conflict detection. Restricted to a manually verified record-level fact_id whitelist
# (see docs/adr/0003). Comparable key must match on every field below; only groups whose
# members carry differing numeric values are conflicts. Metric class decides which
# comparability fields are required vs NOT_APPLICABLE.
# ---------------------------------------------------------------------------
conflict:
  comparable_key_fields:
    - entity_id
    - metric_id
    - period_start
    - period_end
    - period_type
    - accounting_standard
    - consolidation_scope
    - target_currency
    - target_unit
    - claim_type
  metric_class:
    REVENUE: AMOUNT
    GROSS_PROFIT: AMOUNT
    PROFIT_FROM_OPERATIONS: AMOUNT
    PROFIT_ATTRIBUTABLE_TO_OWNERS: AMOUNT
    GROSS_MARGIN: RATIO
  metric_class_required_fields:
    AMOUNT: [target_currency, target_unit]   # both PRESENT
    RATIO: []                                # currency + unit are NOT_APPLICABLE
    PHYSICAL_COUNT: [target_unit]            # unit PRESENT
  # audit_status is NOT part of the comparable key; it only feeds resolution priority.
  # AMBIGUOUS is treated as UNKNOWN (no "audited-preferred" boost, no isolation).
  audit_priority: [AUDITED, REVIEWED, UNAUDITED, UNKNOWN]
  # FR-042 resolution order applied within a conflict group. Values are never averaged
  # or silently chosen; if no single winner survives, the group is CONFLICT_UNRESOLVED.
  resolution_order:
    - COMPARABILITY          # already enforced by the comparable key
    - ELIGIBILITY            # only whitelisted eligible records enter a group
    - SAME_SOURCE_DEDUP      # collapse one source_group to one representative; no reprint voting
    - RESTATEMENT            # restated preferred over original (no restatements detected in v3)
    - AUDIT_STATUS           # audit_priority order
    - STATUTORY_DISCLOSURE   # issuer statutory disclosure preferred
    - SOURCE_TIER            # T1 > T2 > T3 > T4
  resolution_rule_id: RESOLVE_METRIC_CONFLICT_FR042_V1
  # Coarse exclusion reason codes frozen into every non-evaluated record. Fine-grained
  # worksheet labels (noise/wrong-period) are NOT frozen into evidence or rules.
  exclusion_reason_codes:
    text_proposition: TEXT_CONFLICT_OUT_OF_SCOPE           # conflict_status NOT_APPLICABLE
    not_in_whitelist: NOT_IN_CONFLICT_WHITELIST            # numeric, NOT_EVALUATED
    missing_metric_id: MISSING_METRIC_ID                   # numeric, NOT_EVALUATED
    missing_comparability_key: MISSING_COMPARABILITY_KEY   # numeric, NOT_EVALUATED

