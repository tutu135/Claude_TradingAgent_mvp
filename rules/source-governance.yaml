# ---------------------------------------------------------------------------
# Legal state combinations frozen as assertions. Any evidence record violating one of
# these is an integrity FAIL (state_combination_legality check).
# ---------------------------------------------------------------------------
legal_state_combinations:
  quarantined_requires_reason: true          # QUARANTINED must carry >=1 quarantine reason code
  quarantined_permitted_use: NOT_USABLE
  conflict_unresolved_not_usable: true       # CONFLICT_UNRESOLVED => not USABLE
  tier_t3_t4_not_usable: true                # T3/T4 => not USABLE
  t4_only_for_ai_summary: true               # record tier T4 only on AI-summary claim
  included_requires_whitelist: true          # conflict_eligibility INCLUDED only for whitelisted numeric
  text_conflict_status: NOT_APPLICABLE       # TEXT_PROPOSITION => conflict_status NOT_APPLICABLE
  analytic_inference_forbidden: true         # claim_type ANALYTIC_INFERENCE never produced

# ---------------------------------------------------------------------------
# FR-043 deterministic validation: the 13 named checks. Each emits a per-check status
# and reason. The RAG check (locator_chain_consistency) verifies ID-reference
# integrity and source_chunk_text_hash only; it does NOT re-verify locator accuracy,
# which is inherited from the Ticket 03 retrieval acceptance.
# ---------------------------------------------------------------------------
validation_checks:
  - hash_integrity
  - as_of_eligibility
  - content_locator_resolvable
  - required_fields
  - unit_currency_period
  - formula_recomputation
  - source_group_consistency
  - conflict_detection
  - isolation_quarantine
  - id_reference_integrity
  - locator_chain_consistency
  - state_combination_legality
  - whitelist_signature
required_evidence_fields:
  - evidence_id
  - fact_id
  - chunk_id
  - material_id
  - snapshot_id
  - record_kind
  - source_tier
  - source_group_id
  - claim_type
  - evidence_status
  - permitted_use
  - conflict_status
  - conflict_eligibility
  - source_use_note_status
# Recompute only reconciliations Ticket 03 already asserted as determinate; 04 adds no
# new formulas. UNKNOWN reconciliations carry through as NOT_RECOMPUTABLE.
formula_recomputation:
  reconciliation_recomputable_statuses: [PASS]
  amount_tolerance: "0"
inherited_guarantees:
  locator_accuracy: "Content-locator accuracy is inherited from the Ticket 03 retrieval acceptance; this stage re-checks only reference integrity and chunk-text hashes."
