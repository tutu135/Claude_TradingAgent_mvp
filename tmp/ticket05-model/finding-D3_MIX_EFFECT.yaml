dimension_id: D3_MIX_EFFECT
finding: MIXED
finding_statement: >-
  候选证据集中，公司在多个报告期的经营讨论里反复把「产品结构变化（product mix change）」与晶圆出货量、产能利用率、折旧并列，作为营收、销售成本与毛利变动说明中的一个组成项：2025 年年报在毛利变动说明中并列提到出货量增加、产能利用率提升与产品结构变化；2023 年年报在毛利大幅下滑的说明中同样并列提到产能利用率下降、出货量下降与产品结构变化；2026 年第一季度公告则把毛利率由 19.2% 到 20.1% 的变化与产品结构变化及平均售价上升放在同一句表述中。应用结构方面，2025 年年报按应用划分的收入占比显示消费电子由 37.8% 升至 43.2%、智能手机由 27.8% 降至 23.1%，同期按尺寸划分的 12 吋占比基本持平（77.3% 对 77.1%），说明结构变化更多发生在应用维度而非制程尺寸维度。但本维度可承重的量化指标只有一条：FY2025 的 ASP_SOURCE_REPORTED = 6482 CNY，既无上一期可比值，也无按制程或应用拆分的售价、成本、毛利数据，因而无法在本证据集内把结构变化对售价、成本或毛利的影响与出货量、产能利用率、折旧等同时出现的因素分离开来。结论是：存在多期、方向一致的文本证据表明结构变化被公司列为售价与毛利变动的相关因素之一，但缺乏可量化、可分离的承重数据，故判定为 MIXED 而非 SUPPORTED。
supporting_evidence:
  - evidence_id: EVID_15431f7b706e456e0fd4ee74
    role: PRIMARY_SUPPORT
    note: >-
      本维度白名单内唯一可承重的量化观测：FY2025（CAS 口径）ASP_SOURCE_REPORTED = 6482 CNY。它确认「售价」这一被问变量在证据集中确有可追溯的口径与数值，但为单点年度值，无上期可比数、无按制程或应用的拆分。
    overlap_note: >-
      同一售价数据在盈利能力维度也可能被引用。此处的用途不同：本维度只把它作为「售价口径存在且被披露」的锚点，用于界定结构讨论所指向的价格变量，不用它论证利润率水平或其可持续性，故不构成重复计分。
  - evidence_id: EVID_e4b206094f5890f4cf04ffc1
    role: PRIMARY_SUPPORT
    note: >-
      2026 年第一季度公告原文：「Gross margin was 20.1% in 1Q26, compared to 19.2% in 4Q25, due to the product mix change and」。该句把毛利率环比变化与产品结构变化并列表述，是证据集中最直接把结构与毛利联系起来的文本。
    overlap_note: >-
      同一句也可被盈利能力维度用于说明毛利率环比变动幅度。此处只取其中「产品结构变化被列为相关因素」这一层含义，不用于评价毛利率水平本身，故与盈利能力维度的用法不重叠。
  - evidence_id: EVID_c2538a34f11c5131292d1fe8
    role: PRIMARY_SUPPORT
    note: >-
      与上一条同属一段的后半句：「the increase of average selling price in 1Q26.」。它表明在同一期间内，平均售价上升与产品结构变化被公司放在同一组说明因素中，是「结构—售价」关联在证据集内唯一的期间级文本对应。
    overlap_note: >-
      售价变化亦可服务于周期维度（价格是否随行业周期波动）。本维度只使用其与结构表述同段并置这一点，不引申为周期位置判断，因而不构成双重计分。
  - evidence_id: EVID_43289a6874cc99aca0fa341c
    role: PRIMARY_SUPPORT
    note: >-
      2025 年年报毛利变动说明的续句：「to the increase in wafer shipment, the increase in capacity utilisation rate and the product mix change for this year.」。结构变化在毛利上行年份被列为并列因素之一，但与出货量、产能利用率并列，无法单独归因。
    overlap_note: >-
      同一句中的出货量与产能利用率部分属于产能利用率维度的核心素材。本维度只引用其中「产品结构变化」这一并列项及其与毛利说明的同段关系，出货量与利用率在此仅作为不可分离的干扰项被点明，不作为支持力量计入，故非重复。
  - evidence_id: EVID_1c3dc864090cac8f4c9a9b23
    role: PRIMARY_SUPPORT
    note: >-
      2023 年年报毛利下滑说明的续句：「to the decrease of capacity utilization rate, the decrease of wafer shipment and product mix change during this year.」。在毛利下行年份，结构变化同样出现在说明清单中，显示该表述在上下行两个方向上均被使用，其指示性因而被削弱。
    overlap_note: >-
      该句同时可用于周期维度（下行年份特征）。本维度使用它的目的相反：不是刻画周期位置，而是检验「结构变化」表述在不同方向年份中的重复出现，属于对本维度自身证据强度的检验，不与周期维度共享同一论证。
  - evidence_id: EVID_508ec4593d8212410c49cb84
    role: CONTEXT
    note: >-
      2025 年年报按应用划分：消费电子占比 43.2%（上年 37.8%）。表明应用结构在报告期内确有可观测的位移。该数值在本集中标为不可承重，仅作背景。
    overlap_note: >-
      应用占比亦可作为非主业或周期维度的背景。此处仅用于确认「结构确实发生变化」这一前提事实，不参与任何强度判断。
  - evidence_id: EVID_78340e489763db9663aa3022
    role: CONTEXT
    note: >-
      2025 年年报按应用划分：智能手机占比 23.1%（上年 27.8%）。与消费电子占比上升方向相反，共同刻画应用结构位移的幅度。仅作背景。
    overlap_note: >-
      与上一条同源，属同一张应用结构表。此处只作背景，不单独计入证据强度。
  - evidence_id: EVID_87d902958326c93773422130
    role: CONTEXT
    note: >-
      2025 年年报按尺寸划分：12 吋占比 77.1%（上年 77.3%）。制程尺寸结构在同期基本持平，与应用结构的明显位移形成对照，提示「制程结构变化」一侧在本证据集内缺乏可观测位移。
    overlap_note: >-
      尺寸结构数据在资本开支维度也可能被引用（产能投向）。此处仅用于说明本维度问题中「制程结构」一侧证据不足，用途不同。
counter_evidence:
  - evidence_id: EVID_20847c93979c92b6d9eb5597
    note: >-
      2025 年第四季度公告原文：「Gross margin was 19.2% in 4Q25, compared to 22.0% in 3Q25, due to the increase in depreciation.」。该期毛利率下降的说明中并未列入产品结构变化，只提折旧，说明结构并非各期毛利变动说明的稳定组成项。
  - evidence_id: EVID_6e847621bd3a5e7b8471a1d6
    note: >-
      2023 年年报：「During the process of continuous high investments, the Company's gross margin is under the pressure of high depreciation」。折旧被单独点名为毛利承压来源，构成与结构解释并行的替代路径。
  - evidence_id: EVID_f943e43f546a2e5fa8c716e3
    note: >-
      2025 年第四季度公告：「growth was mainly due to the increase in wafer shipment and product mix change in 4Q25.」。同一季度中，结构变化被用于说明收入增长，而毛利率同期下降且说明中未提结构，两处表述指向不一致，削弱了「结构→毛利」的单一方向读法。
alternative_explanations:
  - 折旧规模上升：多期说明中折旧被单独或并列列为成本与毛利变动来源，可在不涉及结构变化的情况下解释毛利率波动。
  - 产能利用率与出货量变化：2025 与 2023 年年报的毛利说明均把利用率与出货量与结构并列，规模效应本身即可解释同方向的毛利变动。
  - 会计口径与币种差异：唯一承重的售价观测为 CAS 口径人民币年度值，而毛利率与成本观测多为 IFRS 口径美元季度值，口径差异本身可产生表观不一致。
  - 行业与需求端因素：年报行业段落提到存储需求挤压其他应用供给、终端价格与需求变化等外部条件，可在结构解释之外影响售价与成本。
limitations:
  - 本维度白名单仅含 ASP_SOURCE_REPORTED，且集内仅有一条可承重记录（FY2025，6482 CNY），量化骨架实际上是单点数据，无同口径上期可比值。
  - 结论主要依赖文本命题而非数值证据；文本中「product mix change」始终与出货量、产能利用率、折旧并列出现，证据集内不存在把结构效应单独量化或分离的披露。
  - 集内所有条目均为公司自身披露（年报与季度业绩公告），不含独立第三方对结构与售价关系的核验材料。
  - 「制程结构」一侧证据薄弱：按尺寸划分的占比在 2025 与 2024 年间几乎持平，集内亦无按制程节点的收入、成本或毛利拆分。
  - 各期表述方向不一致（4Q25 毛利率变动说明未提结构，1Q26 则提及），无法据此建立跨期稳定的关系。
gaps:
  - 缺少按制程节点或按应用划分的售价、单位成本或毛利率拆分数据。
  - 缺少可比期的 ASP 观测（同口径上期值），无法计算售价变化幅度。
  - 缺少把结构效应与出货量、产能利用率、折旧分离的量化归因披露（如结构、价格、量的分解表）。
  - 缺少独立第三方对制程与应用结构变化及其价格影响的核验材料。
management_assertions: []
