snapshot_id: smic-a283e95e2c9e8068
findings:
- dimension_id: D1_PROFITABILITY_CHANGE
  finding: MIXED
  finding_statement: 在统一为 IFRS 美元口径后，候选证据可验证到两层并存的变化。 年度层面，2025 财年毛利率为 21.0%，2024
    财年为 18.0%；同期毛利由 1,447,968 千美元升至 1,956,599 千美元（+35.1%），经营利润由 473,900 千美元升至 1,109,937
    千美元，净利率由 9.1% 升至 10.6%，四项年度指标方向一致向上。 季度层面则并不单调：2025 年第一季度毛利率 22.5%，第二季度 20.4%，第三季度
    22.0%，第四季度回落至 19.2%，2026 年第一季度回升至 20.1%，即最近两个季度的毛利率仍低于 2025 年第一季度水平。 与此同时，2025
    年第四季度毛利环比与同比均下降，2026 年第一季度经营利润环比与同比亦均下降。 在收入于同一期间持续增长的背景下，年度口径的盈利能力改善与最近几个季度的边际回落同时成立，整体判定为
    MIXED。 可验证的变化是「年度盈利能力上台阶、季度盈利能力在 2025 年下半年起走弱并未恢复到 2025 年初水平」，而非单一方向的持续改善。
  supporting_evidence:
  - evidence_id: EVID_3b988db2f6b5049f66b6227a
    role: PRIMARY_SUPPORT
    note: 2025 年报主要财务指标表列示「Gross margin 21.0% 18.0% Increased by 3.0」，为年度毛利率同口径逐年对比的直接记录。
    overlap_note: 毛利率同样可被利用率维度或产品结构维度引用，但那些维度需要的是利用率百分比与结构占比的独立证据；此处只把毛利率本身作为盈利能力结果指标的水平变化来读，不解释其构成，与利用率/结构维度不共用同一结论，不构成重复计分。
  - evidence_id: EVID_f28af2b9e69c01c2b43fd0de
    role: PRIMARY_SUPPORT
    note: 2025 年报管理层讨论表列示「Gross profit 1,956,599 1,447,968 35.1」，给出年度毛利绝对额与变动幅度。
    overlap_note: 毛利绝对额也可能在周期维度中作为景气位置的旁证，但周期维度关心的是同业与需求侧节奏；此处仅用其确认公司自身年度盈利规模的量级变化，与周期判断不共用同一结论，不构成重复计分。
  - evidence_id: EVID_38ba63715dd51c6304b026ab
    role: PRIMARY_SUPPORT
    note: 2025 年报利润表列示「Profit from operations 1,109,937 473,900」，为经营层面盈利的年度对比。
    overlap_note: 经营利润也可被非经常性损益维度引用，但该维度需要的是其他收益/损失与政府补助等单项证据；此处只取经营利润总额的年度变化，未拆分其中的非经常项，二者读取的层级不同，不构成重复计分。
  - evidence_id: EVID_16327139f06b3e53b66585fe
    role: PRIMARY_SUPPORT
    note: 2025 年报主要财务指标表列示「Net margin 10.6% 9.1% Increased by 1.5 17.8%」，为年度净利率的同口径对比。
    overlap_note: 净利率含非经营项，可能同时进入非经常性损益维度；此处仅将其作为「年度综合盈利率是否同向变化」的交叉验证，非经常项的归属留给该维度，故非重复计分。
  - evidence_id: EVID_a3f92a279254fc09ad1ea142
    role: PRIMARY_SUPPORT
    note: 2025 年第一季度毛利率 22.5%（IFRS、美元口径），构成季度序列的起点水平。
    overlap_note: 单季毛利率也可能在可持续性维度中被引用为波动性素材；此处仅用其确定季度序列的起点数值，波动是否可持续的判断不在本条内完成，故非重复计分。
  - evidence_id: EVID_6827b1e1cf99ee76189e5f2e
    role: PRIMARY_SUPPORT
    note: 2025 年第四季度毛利率 19.2%（IFRS、美元口径），为五个季度中的最低值。
    overlap_note: 该季度毛利率回落同时可被资本开支/折旧维度引用（折旧上升期），但那需要独立的折旧与在建产能证据；此处只记录盈利率水平的下移事实，不做成因归属，故非重复计分。
  - evidence_id: EVID_d6efa2d8f71dc14d7c9c89c1
    role: PRIMARY_SUPPORT
    note: 2026 年第一季度毛利率 20.1%（IFRS、美元口径），显示环比回升但仍低于 2025 年第一季度的 22.5%。
    overlap_note: 该点位也与产品结构维度相关（公司自述涉及结构与均价变化），但结构维度需要结构占比与均价的独立证据；此处仅使用毛利率数值本身刻画最新水平，故非重复计分。
  - evidence_id: EVID_49b0a2d636a94a70f10566a8
    role: CONTEXT
    note: 2026 年第一季度研发费用 187.1 百万美元，作为费用侧的背景信息；该项标注 bearing=NO，仅用于说明毛利以下的费用结构存在同期变动，不用于确定盈利能力变化的方向。
    overlap_note: 该费用项更适合归入研发投入或可持续性维度；本维度仅作背景引用且不承重，不参与方向判断，故不构成重复计分。
  counter_evidence:
  - evidence_id: EVID_a9e7bdcf575cdf9e5cbd1445
    note: 2025 年第四季度业绩表列示「Gross profit 478,121 522,811 -8.5% 499,011 -4.2%」，该季毛利环比与同比双降，与「年度改善即持续改善」的读法相反。
  - evidence_id: EVID_ce52d35fc78952c0fa924568
    note: 2026 年第一季度业绩表列示「Profit from operations 247,792 298,620 -17.0% 309,571 -20.0%」，最新季度经营利润环比与同比双降，年度改善未延续到最新可得季度。
  alternative_explanations:
  - 年度毛利率上行与出货量、产能利用率的同期变化并存，年度改善可能主要反映产能与出货的规模条件变化，而非单位产品盈利能力的独立提升；候选集中缺少可用的利用率与出货量数值证据来分离两者。
  - 季度毛利率的起伏可能与产品组合和平均售价的季节性变化同时出现，在仅有五个季度的窗口内难以与趋势性变化区分。
  - 折旧在高投入期上升与毛利率回落在时间上重叠，最近两个季度的边际走弱可能属于成本结构的阶段性特征，而非盈利能力的结构性削弱。
  - 净利率与经营利润与其他收益/损失的波动同期并存（如 4Q25 其他收益净额为 -72,117 千美元、1Q26 为 +7,539 千美元），年度综合盈利率的改善幅度可能被非经营项放大或压缩。
  limitations:
  - 候选集中大量 CAS 口径数值记录被标注为 FISCAL_YEAR 2025-01-01..2025-12-31，但来源为 SG_SMIC_2025_H1
    半年度材料，属于已知的期间标注缺陷；同组记录还出现 REVENUE = -6 CNY、COST_OF_SALES = -2 CNY、REVENUE = 23.1
    CNY 等量级明显不合理的值，本判断未采用任何该组记录。
  - 部分数值记录的指标名与单位/量级不一致，例如 GROSS_MARGIN 被标注为 MONEY USD 且取值 1859011、2、3、25 等，这些记录无法作为口径统一后的盈利率使用，已全部排除。
  - 同一季度的同一指标在不同来源组中重复出现（如 4Q25 毛利率 19.2% 同时来自 SG_SMIC_2025_Q4_RESULTS 与 SG_SMIC_2026_Q1_DISCLOSURE），本判断按单一事实计一次，未因重复来源加重结论强度。
  - 可用的同口径序列仅覆盖 IFRS 美元口径的 2025 年第一季度至 2026 年第一季度共五个季度，以及 2023—2025 三个财年，窗口偏短，季度层面的方向判断对端点取值敏感。
  - 候选集未提供 IFRS 与 CAS 之间盈利指标的定量桥接，仅有文字性的差异说明，跨准则口径的可比性未在本维度内验证。
  gaps:
  - 缺少按产品线、技术节点或应用领域拆分的毛利率数值证据，无法在同一口径下对盈利能力变化做结构分解。
  - 缺少连续季度的折旧与摊销数值证据，无法量化其在毛利率变动中的占比。
  - 缺少可用的季度产能利用率与出货量数值记录（相关内容仅以文字形式出现），无法与毛利率序列做同口径对照。
  - 缺少 2026 财年完整年度口径数据，最新年度层面的变化只能以 2025 财年为终点。
  management_assertions:
  - evidence_id: EVID_e4b206094f5890f4cf04ffc1
    statement: 公司称（2026 年第一季度业绩公告）："Gross margin was 20.1% in 1Q26, compared to 19.2%
      in 4Q25, due to the product mix change and"，该句在同一材料中以 EVID_dbe5d61b66a43b6da49dc305
      续接 "the increase of average selling price in 1Q26."，属公司自述的成因说明，未经本维度独立核验。
  - evidence_id: EVID_20847c93979c92b6d9eb5597
    statement: 公司称（2025 年第四季度业绩公告）："Gross margin was 19.2% in 4Q25, compared to 22.0%
      in 3Q25, due to the increase in depreciation."，属公司自述的成因说明，未经本维度独立核验。
  - evidence_id: EVID_43289a6874cc99aca0fa341c
    statement: 年报称（2025 年年报管理层讨论），年度毛利变化归因于 "to the increase in wafer shipment, the
      increase in capacity utilisation rate and the product mix change for this year."，属公司自述的成因说明，未经本维度独立核验。
  - evidence_id: EVID_759908b984d49c1fedb7c038
    statement: 公司称（2025 年第四季度业绩公告的管理层评论）给出前瞻性指引："gross margin is expected to be in
      the range of 18% to 20%."，属公司对未来期间的预期陈述，不是已发生的可核验事实。
- dimension_id: D2_UTILIZATION_EFFECT
  finding: SUPPORTED
  finding_statement: 候选证据集中不存在可承重的利用率或产能类数值记录，本维度的判断只能建立在公司定期报告的文本命题之上。 在这些文本命题中，公司在年报里反复把产能利用率与盈利能力放在同一句解释里陈述：中国会计准则口径年报在毛利变动的原因说明中列出当年产能利用率下降，
    与产品组合变动、晶圆销售数量减少并列；营业成本的原因说明中同样列出产能利用率下降，与产品组合变动、折旧增加并列； 国际财务报告准则口径的年报在销售成本与毛利的说明中给出同样的并列表述，两套口径互相印证。
    公司同时在年报中把提升产能利用率与优化产品组合、优化工艺制程一并列为提升整体盈利能力的措施。 在较晚的年度，公司致股东的信中把产能利用率同比提升与毛利率同比提升写在同一段落内，二者方向一致；较早的下行年度中，利用率的下降与毛利的下滑同时出现，方向同样一致。
    在公司自身披露的口径下，利用率被列入与盈利能力变化相关的机制清单，且在上行与下行两个阶段中与盈利指标同向变动，本维度据此判为支持，而非拖累或无法解释。 需要强调的是，这些文本只表明利用率被公司列入解释项并与盈利指标同向变动，未给出各因素的贡献度拆分，也没有可核验的利用率与毛利率成对数值序列作为承重支撑。
  supporting_evidence:
  - evidence_id: EVID_b1c888ce8a1e8062eafc586e
    role: PRIMARY_SUPPORT
    note: 中国会计准则口径年报的毛利变动原因说明中，当年产能利用率下降列为首项，与晶圆销售数量减少及产品组合变动并列，属于公司自身把利用率纳入盈利解释项的直接文本。
    overlap_note: 同一句也提到产品组合与销售数量，这些部分可在结构与周期维度承重；本维度只取其中的利用率分句，其余分句留给对应维度，不构成重复计分。
  - evidence_id: EVID_4524a43ea22b3d39a75acad1
    role: PRIMARY_SUPPORT
    note: 同一份年报的营业成本变动原因说明中同样列出当年产能利用率下降，与产品组合变动和折旧增加并列，指向固定成本吸收侧的成本口径而非毛利口径。
    overlap_note: 句中的折旧部分可在资本开支维度承重；本维度只使用利用率分句，且与毛利口径的证据分属成本端与利润端两个不同披露位置，不构成重复计分。
  - evidence_id: EVID_c515b1039aecf047ebcc1197
    role: PRIMARY_SUPPORT
    note: 国际财务报告准则口径年报在销售成本说明中给出与中国会计准则口径一致的并列表述，两套准则的独立披露互相印证同一文本事实。
    overlap_note: 该句同时涉及产品组合与折旧，可在结构与资本开支维度承重；此处只作为跨准则口径一致性的利用率证据使用，不重复用于其他维度的方向判断。
  - evidence_id: EVID_1c3dc864090cac8f4c9a9b23
    role: PRIMARY_SUPPORT
    note: 国际财务报告准则口径年报在毛利说明中列出产能利用率下降、晶圆出货下降与产品组合变动三项并列因素，构成下行阶段的利用率与盈利同向记录。
    overlap_note: 出货量与产品组合部分归属周期与结构维度承重；本维度仅取利用率分句，与成本端证据分属不同披露段落，不构成重复计分。
  - evidence_id: EVID_3154aa1a93149fb86a04d72c
    role: PRIMARY_SUPPORT
    note: 年报在风险与经营段落中陈述公司通过优化产品组合、提升利用率、精进工艺制程来增强整体盈利能力，表明利用率在公司自述的盈利机制清单中占据位置。
    overlap_note: 产品组合部分可在结构维度承重，工艺制程部分可在可持续性维度承重；本维度只援引其中的利用率一项作为机制存在性的文本依据，不构成重复计分。
  - evidence_id: EVID_ac341415e94d16e43f70b315
    role: PRIMARY_SUPPORT
    note: 较晚年度的致股东的信中记载产能利用率同比提升，与前述下行年度的利用率下降形成方向相反的两个阶段，本维度的方向在跨周期上保持一致。
    overlap_note: 同段落还提到折旧与代工地位，可在资本开支与可持续性维度承重；本维度只取利用率提升这一分句，毛利率部分另以上下文角色引用，不构成重复计分。
  - evidence_id: EVID_921e1d21d4acaffbf75b5190
    role: CONTEXT
    note: 同一封致股东的信中，毛利率同比提升与折旧大幅增长写在与利用率提升相邻的语句中，仅用于呈现两者在同一披露段落内的并存关系，不由其承担本维度方向。
    overlap_note: ''
  - evidence_id: EVID_391db1c31ad31d10c4481811
    role: CONTEXT
    note: 单季资本开支数值仅用于说明公司处于持续产能建设阶段这一背景，不是利用率或产能指标，不得作为利用率的替代量，不承担本维度方向。
    overlap_note: ''
  counter_evidence:
  - evidence_id: EVID_6e847621bd3a5e7b8471a1d6
    note: 年报陈述在持续高投入过程中毛利率承受较高折旧压力，说明盈利能力变化存在与利用率并行的另一条披露渠道，削弱把变化单独归入利用率的解释力。
  - evidence_id: EVID_e7103d2a15cefb9eaf2c7f2a
    note: 年报陈述当年集团处于高投入期、折旧较上年增加，与利用率的表述同期并存，构成对利用率单一解释的直接制衡。
  - evidence_id: EVID_3639b4225c2c0e412050cf02
    note: 季报文本显示利用率在相邻季度间存在回落与波动，而候选集内没有与之配对的同期毛利率文本，季度层面的同向关系无法在本证据集内核验。
  alternative_explanations:
  - 折旧与高投入阶段的固定成本上升，在公司披露中与利用率并列出现，可独立解释盈利能力变化的一部分。
  - 产品组合变动在成本与毛利两处说明中均与利用率并列，可能承担相当比例的解释。
  - 晶圆出货数量与平均售价变化在年报中被单独列示，属于与利用率不同的量价渠道。
  - 政府补助、汇兑与利息等非经营项目在同期报表中变动明显，可影响利润口径而与产能吸收无关。
  limitations:
  - 本维度的承重指标白名单为空，候选数值记录仅有资本开支、营业收入与营业利润，均不是利用率或产能指标，无任何数值证据承担方向。
  - 利用率与盈利指标的并列表述来自公司自身的原因说明，属于公司口径的归因，未经独立验证。
  - 证据集中的文本命题是按结构切分的分句，部分语义依赖被切走的上下文，单句可读性受限。
  - 同一披露段落内的并存关系不等同于机制强度，本证据集不支持对贡献度或弹性作任何量化陈述。
  - 中国会计准则口径与国际财务报告准则口径、年报与季报的期间与币种口径不一致，跨口径比较仅能作定性使用。
  gaps:
  - 缺少可承重的利用率数值记录，无法构成利用率与毛利率的成对时间序列。
  - 缺少折旧占营业成本比重的口径，无法核验固定成本吸收这一具体机制。
  - 缺少公司对利用率、产品组合、折旧三项各自贡献度的拆分披露。
  - 缺少季度层面利用率与毛利率的同期配对披露，季度粒度的同向关系无法核验。
  management_assertions: []
- dimension_id: D3_MIX_EFFECT
  finding: MIXED
  finding_statement: 候选证据集中，公司在多个报告期的经营讨论里反复把「产品结构变化（product mix change）」与晶圆出货量、产能利用率、折旧并列，写在营收、销售成本与毛利变动的说明清单中：2025
    年年报的毛利变动说明里，出货量增加、产能利用率提升与产品结构变化三项并列出现；2023 年年报的毛利下滑说明里，产能利用率下降、出货量下降与产品结构变化同样并列出现；2026
    年第一季度公告则把毛利率由 19.2% 到 20.1% 的变化与产品结构变化、平均售价上升写在同一句表述内。应用结构方面，2025 年年报按应用划分的收入占比显示消费电子由
    37.8% 升至 43.2%、智能手机由 27.8% 降至 23.1%，同期按尺寸划分的 12 吋占比基本持平（77.3% 对 77.1%），结构位移集中在应用维度而非制程尺寸维度。但本维度可承重的量化指标只有一条：FY2025
