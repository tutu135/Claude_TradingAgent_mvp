    CONTEXT 角色引用，量化骨架实际上是单点数据，无同口径上期可比值。
  - 结论主要依赖文本命题而非数值证据；文本中「product mix change」始终与出货量、产能利用率、折旧并列出现，证据集内不存在把结构效应单独量化或分离的披露。
  - 集内所有条目均为公司自身披露（年报与季度业绩公告），不含独立第三方对结构与售价关系的核验材料。
  - 「制程结构」一侧证据薄弱：按尺寸划分的占比在 2025 与 2024 年间几乎持平，集内亦无按制程节点的收入、成本或毛利拆分。
  - 各期表述方向不一致（4Q25 毛利率变动说明未提结构，1Q26 则提及），跨期稳定的关系无法在本证据集内建立。
  gaps:
