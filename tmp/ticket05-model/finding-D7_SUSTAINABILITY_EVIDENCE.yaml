dimension_id: D7_SUSTAINABILITY_EVIDENCE
finding: MIXED
finding_statement: >-
  在本维度的封闭候选证据集中，盈利能力改善本身在时间与口径上具有一定的可观察性：2025 年全年收入同比增长
  16.2%、毛利率提升 3.0 个百分点至 21.0%，2024 年全年收入同比增长 27.0%，同期年化产能利用率提升 8 个百分点至
  93.5%，第四季度产能利用率为 95.7%；季度层面 2025 年 Q2 至 Q4 毛利率依次为 20.4%、22.0%、19.2%，第四季度环比回落。
  但必须说明：本维度的承重指标白名单为空，上述收入、销售成本、毛利与毛利率均属结果性指标，用结果证明结果本身可持续属于循环论证，
  故它们在本判断中仅作为背景信息引用，不承担支撑重量。真正指向经营机制的披露仅有年报中「通过优化产品组合、提高产能利用率、精进工艺
  提升整体盈利能力」这一句，2024 与 2025 两版年报措辞几乎一致，属于通用性机制表述，未附带可核验的产品结构、价格、单位成本或费用拆分数据；
  与此同时公司在风险章节反复提示业绩波动、毛利率波动、资产减值与持续大额资本开支压力。快照中存在经营活动现金流记录，但本维度冻结的检索族
  未将其取回，故无法在本证据集内做现金流与利润的交叉验证。综合而言，改善事实可跨期、跨结果指标观察到，但「有经营机制支持且可持续」这一
  命题在当前证据集内未获得可承重的独立验证，故判定为 MIXED。
supporting_evidence:
  - evidence_id: EVID_7f523f5b558ecd8b586991d9
    role: PRIMARY_SUPPORT
    note: 2025 年年报披露公司通过优化产品组合、提高产能利用率、精进工艺来提升整体盈利能力，是本证据集中唯一直接描述盈利机制的公司披露。
    overlap_note: 同一句在 D 系其他维度（如竞争力或经营质量类维度）也可能被引用，但那里承担的是「公司是否具备经营抓手」的描述性作用；本维度只用它检验
      「改善是否有被披露的机制解释」，且已明确其为通用表述、未附拆分数据，不作为可持续性的独立证明，故不构成重复计量。
  - evidence_id: EVID_3154aa1a93149fb86a04d72c
    role: PRIMARY_SUPPORT
    note: 2024 年年报中出现措辞几乎相同的盈利机制表述，可用于检验该机制披露在跨年度上的稳定性，同时也说明其为跨年重复的模板化语句。
    overlap_note: 与上一条同源但属不同年度文件，在本维度的作用是「跨期一致性检验」而非再次证明机制有效；其他维度若引用，引用的是机制内容本身，
      两者用途不同，不构成重复计量。
  - evidence_id: EVID_bfa338a32e5774667b036775
    role: CONTEXT
    note: 2025 年第四季度毛利率 19.2%、产能利用率 95.7%，作为期末经营负荷与结果指标的背景读数。
    overlap_note: ""
  - evidence_id: EVID_2a7313c13e2e5c8906a767bf
    role: CONTEXT
    note: 年化产能利用率同比提升 8 个百分点，与全年结果指标改善处于同一期间，仅作背景，不作为机制证明。
    overlap_note: ""
  - evidence_id: EVID_f90533faff49aad01a87a752
    role: CONTEXT
    note: 与上一条同段落，给出年化产能利用率的具体水平 93.5%。
    overlap_note: ""
  - evidence_id: EVID_eb92a4da2d3d97b5b80eb6bf
    role: CONTEXT
    note: 2025 年全年收入同比增长 16.2% 至 93.27 亿美元、毛利率提升，属结果性指标背景。
    overlap_note: ""
  - evidence_id: EVID_92274e4288006aaeb477ca74
    role: CONTEXT
    note: 与上一条同段落，毛利率提升 3.0 个百分点至 21.0%，属结果性指标背景。
    overlap_note: ""
  - evidence_id: EVID_af629896441719c1cc08a092
    role: CONTEXT
    note: 2024 年年报披露全年收入 80.299 亿美元、同比增长（配合 EVID_d8c508fc157986f29f4221ed 的 27.0%），提供更早期的结果指标基线。
    overlap_note: ""
counter_evidence:
  - evidence_id: EVID_6827b1e1cf99ee76189e5f2e
    note: 2025 年第四季度毛利率 19.2%，较第三季度 22.0% 环比回落，说明结果指标的改善在季度序列上并不单调。
  - evidence_id: EVID_0a7d6f7545b73e221846761d
    note: 2025 年年报在经营风险中单列「业绩波动风险」，与「改善可持续」的命题方向相反。
  - evidence_id: EVID_280a312fa4d2242c710058e1
    note: 2025 年年报提示宏观、行业景气、客户需求、供应链价格与研发费用等可能使销售收入、毛利率承受波动。
  - evidence_id: EVID_c520e297f760b3b478bd5501
    note: 2025 年年报提示业绩稳定性、经营效率与持续盈利能力可能受到不利影响，属公司自身对可持续性的限定性披露。
alternative_explanations:
  - 结果指标改善可能与行业周期上行同步：年报披露 2024 年半导体市场呈复苏态势、2025 年行业延续增长，周期性因素与公司内部机制在本证据集内无法区分。
  - 改善可能伴随产能规模扩张与出货量增长（全年出货约 970 万片、年末产能约 105.9 万片 8 英寸当量），属规模效应而非单位盈利结构的改善。
  - 毛利率变化可能与产能利用率的高位运行同步，而高利用率本身可能是需求侧短期状态，不必然对应长期机制。
  - 会计口径与期间划分（IFRS 单季数据、快照内同一期间存在多条口径不同的销售成本记录）也可能影响跨期比较的表观改善幅度。
limitations:
  - 本维度承重指标白名单为空，18 条可用数值全部为结果性指标（收入、销售成本、毛利、毛利率），只能作背景引用，无法承担可持续性论证的重量。
  - 唯一的机制性披露为年报模板化语句，2024 与 2025 两版措辞高度重合，未提供产品结构、价格、单位成本、费用率等可核验拆分。
  - 候选集内同一期间存在多条数值不一致的销售成本记录（如 2025 年 Q3 期间同时出现 1859.0 与 1759.3 百万美元），跨期毛利桥的自行推算不具可靠性，故未进行。
  - 候选文本大量为年报风险章节与业务模式章节的切片，句子被截断，语义完整性有限，不宜据以做因果推断。
  - 前瞻性指引材料只能作为具名公司陈述记录，不能用于支撑或反驳本维度结论。
gaps:
  - 经营活动现金流记录存在于快照中，但本维度冻结的检索族未将其取回，无法在本证据集内完成利润与现金流的交叉验证。
  - 缺少费用结构（研发费用、销售管理费用）与折旧摊销的期间数据，无法检验毛利改善是否被下游成本项抵消。
  - 缺少产品结构、晶圆平均单价、各技术节点收入占比等分项数据，无法核验「优化产品组合」这一机制表述。
  - 缺少客户集中度与订单/在手订单的量化披露，无法判断需求侧支撑的稳定性。
management_assertions:
  - evidence_id: EVID_759908b984d49c1fedb7c038
    statement: 公司在 2025 年第四季度业绩材料中表示，2026 年第一季度毛利率预计在 18% 至 20% 区间。
  - evidence_id: EVID_608ec900f29e9941221ebc20
    statement: 公司在 2026 年第一季度业绩材料中表示，第二季度毛利率预计在 20% 至 22% 区间。
  - evidence_id: EVID_a2a9122327152a79c0162dfd
    statement: 公司管理层表示，基于客户需求与在手订单，对本年度整体业务较上季度更为乐观。
  - evidence_id: EVID_937ccb9a137eb428b0ba681e
    statement: 公司表示，2026 年资本开支预计与 2025 年大致持平。
watch_indicators:
  - indicator: 季度毛利率（公司季度业绩公告披露口径）
    judgment_logic: 若后续季度实际毛利率持续低于公司已披露的指引区间下限，则结果指标改善的跨期连续性被削弱，本维度结论应向 NOT_SUPPORTED 方向下调；
      若实际值稳定处于或高于区间上限，则维持现有 MIXED 判断而不自动上调，机制层面的缺口并未随之补齐。
    threshold: "18%"
    threshold_basis: SOURCE_DISCLOSED_THRESHOLD
    basis_evidence_id: EVID_759908b984d49c1fedb7c038
  - indicator: 年化/季度产能利用率（公司业绩公告披露口径）
    judgment_logic: 产能利用率与毛利率在同一期间同向变动时，说明结果指标高度依赖负荷水平；若利用率明显回落而毛利率同步走弱，则「有经营机制支持」的解释
      进一步减弱，结论应下调。
    threshold: UNKNOWN
    threshold_basis: UNKNOWN
    basis_evidence_id: null
  - indicator: 经营活动产生的现金流量净额与净利润的期间对照（年报/季报现金流量表）
    judgment_logic: 该数据在本维度证据集内缺失；一旦取得，若利润改善期间经营活动现金流未同向改善，则盈利改善的质量存疑，本维度结论应下调；
      若两者同向且幅度相称，则可支持向 SUPPORTED 方向修正。
    threshold: UNKNOWN
    threshold_basis: UNKNOWN
    basis_evidence_id: null
  - indicator: 年报披露的盈利机制表述是否附带分项数据（产品组合、单价、单位成本拆分）
    judgment_logic: 若后续年报仍仅重复「优化产品组合、提高产能利用率、精进工艺」的通用表述而无可核验拆分，则机制层面的证据缺口保持不变，
      本维度不应上调；若出现分项披露且与毛利变动方向一致，则可支持上调。
    threshold: UNKNOWN
    threshold_basis: UNKNOWN
    basis_evidence_id: null
  - indicator: 资本开支规模与固定资产减值/存货跌价相关披露
    judgment_logic: 公司披露 2025 年资本开支为 81 亿美元并提示折旧负担与资产减值风险；若后续期间出现减值计提或折旧压力披露扩大，
      同时毛利率走弱，则可持续性判断应下调。
    threshold: UNKNOWN
    threshold_basis: UNKNOWN
    basis_evidence_id: null
