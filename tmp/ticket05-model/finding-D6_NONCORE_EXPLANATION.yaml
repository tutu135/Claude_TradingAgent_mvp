dimension_id: D6_NONCORE_EXPLANATION
finding: MIXED
finding_statement: >-
  候选证据可以证明政府补助与其他营业收入在中芯国际的利润构成中体量可观且逐年波动，但不足以量化它们对盈利能力变化的解释比例。
  中国企业会计准则口径下，计入当期损益的政府补助 2023 年为 1,677,347 千元，2024 年为 1,333,945 千元，2025 年为 1,582,524 千元，
  呈现先降后升的波动；国际财务报告准则口径的非经常性损益披露中，政府补助 2025 年为 222,637 千美元、2024 年为 187,686 千美元、
  2023 年为 236,425 千美元，同期非经常性损益合计分别为 109,575、123,818、436,563 千美元，而当年利润分别为 988,944 与 729,993 千美元，
  可见补助规模与利润规模处于同一数量级，非核心项目在报表利润中占有可观份额。
  与此同时，年报披露该期间息税折旧摊销前利润及其利润率的变化主要与晶圆出货量、产能利用率与产品结构相关，
  补助并未被公司列为盈利能力变化的主要说明口径。候选集合内缺少可复算的毛利率或净利率分解，
  也缺少将补助金额与利润率变动逐期对应的桥接数据，在此前提下只能确认非核心因素在规模上重要且波动明显，
  无法给出其解释盈利能力变化的确定份额，结论为部分支持。
supporting_evidence:
  - evidence_id: EVID_0d549953e11009b614bdee9d
    role: PRIMARY_SUPPORT
    note: 中国企业会计准则口径 2023 财年计入当期损益的政府补助为 1,677,347 千元，构成非核心损益基线。
    overlap_note: >-
      该金额同时包含在 D1 所分析的报表利润之内，也与可持续性维度相关；在本维度中它被用作衡量非核心项目自身规模与年度间波动的口径，
      而非用来重复评价利润水平本身，在此意义上不构成对 D1 的重复计数。
  - evidence_id: EVID_97d41328fbf5d641da666274
    role: PRIMARY_SUPPORT
    note: 2024 财年计入当期损益的政府补助为 1,333,945 千元，较 2023 年下降。
    overlap_note: >-
      同一笔补助已计入 D1 所使用的报表利润，本维度仅取其年度间的方向与幅度用于判断非核心因素的变动，
      不再对利润总额做第二次加权，故非重复计数。
  - evidence_id: EVID_00021b95b7341434185a4255
    role: PRIMARY_SUPPORT
    note: 2025 财年计入当期损益的政府补助为 1,582,524 千元，较 2024 年回升。
    overlap_note: >-
      该数字亦位于 D1 的利润口径内部，并可能与资本开支维度的设备类补助相关；此处只用于刻画非核心项目的年度波动路径，
      未重复用于评价利润或资本开支水平。
  - evidence_id: EVID_42bc010cf9031d1137d6ad44
    role: PRIMARY_SUPPORT
    note: 2023 财年其他营业收入为 2,577,275 千元，是承载政府补助确认的报表科目。
    overlap_note: >-
      其他营业收入同样进入 D1 的利润构成，并与递延收益释放节奏、进而与折旧口径存在联系；
      本维度使用它是为了定位非核心收入的规模与其在报表中的落点，不重复评价盈利能力水平。
  - evidence_id: EVID_6dc910188f51d398a252dfc8
    role: CONTEXT
    note: 2025 年年报非经常性损益表列示政府补助 222,637、187,686、236,425 千美元（2025/2024/2023）。
    overlap_note: ""
  - evidence_id: EVID_5f5e3a69713e087b033996e6
    role: CONTEXT
    note: 同表非经常性损益合计为 109,575、123,818、436,563 千美元，可与补助金额对照观察非核心项目的净影响。
    overlap_note: ""
  - evidence_id: EVID_c7990a96f80f5f982e258933
    role: CONTEXT
    note: 2025 与 2024 年度利润分别为 988,944 与 729,993 千美元，用于比较补助与利润的数量级。
    overlap_note: ""
  - evidence_id: EVID_b98a7e786ac2a8e90fb59b1b
    role: CONTEXT
    note: 2025 年年报附注载明集团收到政府资助 193.0 百万美元（2024 年为 261.8 百万美元）并确认相应收入，收到额与确认额并不同步。
    overlap_note: ""
counter_evidence:
  - evidence_id: EVID_82053569393d872bbf3d0c0d
    note: 2025 年年报在解释息税折旧摊销前利润及其利润率变化时，指向晶圆出货量、产能利用率与产品结构，未把政府补助列为主要说明口径。
  - evidence_id: EVID_b44990fde51e27f29bd8aacb
    note: 2024 年年报对息税折旧摊销前利润变化的说明同样落在晶圆出货量与产品结构上，与非核心因素主导的判断不一致。
  - evidence_id: EVID_2407ff7913bbf5adec678577
    note: 2024 年年报将息税折旧摊销前利润率的下降与其增速低于收入增速并列说明，属于经营口径而非非核心项目口径。
alternative_explanations:
  - 出货量、产能利用率与产品结构的变化可在不依赖政府补助的情况下与同期盈利能力变化并存。
  - 折旧与摊销规模的持续扩大与毛利率变化同期出现，可能是比非核心项目更重要的解释路径。
  - 非经常性损益中还包含公允价值变动损益、资产处置损益与联营企业相关项目，其合计波动幅度大于补助本身。
  - 递延收益按设备使用年限或里程碑分期释放，确认节奏与实际收到金额并不同步，年度间落差可能来自会计确认时点而非经营变化。
limitations:
  - 部分上游数值记录存在期间标注缺陷：多条来自 2025 年半年度报告与第三季度报告的记录被标注为 FISCAL_YEAR 2025，其数值不应按全年口径理解。
  - 候选集合内出现明显不合常理的数值，如其他营业收入 40.3 与营业收入 -6625、-65467、-518163 千元，这些应视为口径或抽取缺陷，不据以推理。
  - 中国企业会计准则口径以千元列示、国际财务报告准则口径以千美元列示，候选集合内没有可复算的汇率或桥接关系，跨口径数值只能并列观察。
  - 候选集合内没有毛利率或净利率的逐期分解，也没有把补助金额换算为利润率贡献点数的可复算公式。
  - 2024 财年的其他营业收入在数值记录中缺位，三年科目层面的连续对照并不完整。
gaps:
  - 缺少与盈利能力指标同频的季度政府补助确认序列，无法把补助波动与季度利润率变化逐期对齐。
  - 缺少递延收益余额的分期释放计划，无法判断未来期间非核心收入的确认节奏。
  - 缺少剔除政府补助后的经营利润口径披露，无法直接观察扣除非核心因素后的盈利能力路径。
management_assertions: []
