challenges:
- challenge_id: CH_001
  round: 1
  category: SOURCE_TRACEABILITY
  target_kind: FINDING
  target_id: D1_PROFITABILITY_CHANGE
  question: 本维度证据分为 3，依赖「两个以上独立同源组」。4Q25 毛利率 19.2% 同时出现在 SG_SMIC_2025_Q4_RESULTS 与
    SG_SMIC_2026_Q1_DISCLOSURE，是否属于伪多源，从而使证据分虚高？
  disposition: RESOLVED_NO_CHANGE
  reason: 一次定向复核：承重的跨期可比数值是 2025 年报中 FY2025 与 FY2024 的 GROSS_MARGIN 对比，来自年度报告这一次原始披露；季度公告是另一次独立披露。被质疑的
    19.2% 重复对已在限制中披露，且未作为跨期比较的承重项，证据分依据不变。
- challenge_id: CH_002
  round: 1
  category: SOURCE_TRACEABILITY
  target_kind: FINDING
  target_id: D2_UTILIZATION_EFFECT
  question: 本维度方向为 SUPPORTED，但支撑证据同时来自 CAS 口径年报与 IFRS 口径年报。两者是否为同一次原始披露的两种呈报，即伪多源？
  disposition: RESOLVED_WITH_REVISION
  reason: 一次定向复核确认两条表述指向同一年度同一次原始披露，互相印证不构成独立来源；且本维度承重指标白名单为空，无任何数值证据可独立支撑方向。方向由 SUPPORTED
    下调为 MIXED，并在限制中写明伪多源。
  revision:
    dimension_id: D2_UTILIZATION_EFFECT
    finding_after:
      dimension_id: D2_UTILIZATION_EFFECT
      finding: MIXED
      finding_statement: 候选证据集中不存在可承重的产能利用率数值记录，本维度只能依据公司自身披露的文本表述。定向复核发现，中国企业会计准则口径年报与国际财务报告准则口径年报的相关表述来自同一年度的同一次原始披露，两者互相印证不构成独立多来源。在此口径下，利用率在公司的成本与毛利说明中被列为与盈利能力变化同时出现的因素之一，但证据集内没有独立于公司自身表述的记录，方向由
        SUPPORTED 下调为 MIXED。
      supporting_evidence:
      - evidence_id: EVID_b1c888ce8a1e8062eafc586e
        role: PRIMARY_SUPPORT
        note: 中国会计准则口径年报的毛利变动原因说明中，当年产能利用率下降列为首项，与晶圆销售数量减少及产品组合变动并列，属于公司自身把利用率纳入盈利解释项的直接文本。
        overlap_note: 同一句也提到产品组合与销售数量，这些部分可在结构与周期维度承重；本维度只取其中的利用率分句，其余分句留给对应维度，不构成重复计分。
      - evidence_id: EVID_4524a43ea22b3d39a75acad1
        role: PRIMARY_SUPPORT
        note: 同一份年报的营业成本变动原因说明中同样列出当年产能利用率下降，与产品组合变动和折旧增加并列，指向固定成本吸收侧的成本口径而非毛利口径。
        overlap_note: 句中的折旧部分可在资本开支维度承重；本维度只使用利用率分句，且与毛利口径的证据分属成本端与利润端两个不同披露位置，不构成重复计分。
      - evidence_id: EVID_c515b1039aecf047ebcc1197
        role: PRIMARY_SUPPORT
        note: 国际财务报告准则口径年报在销售成本说明中给出与中国会计准则口径一致的并列表述，两套准则的独立披露互相印证同一文本事实。
        overlap_note: 该句同时涉及产品组合与折旧，可在结构与资本开支维度承重；此处只作为跨准则口径一致性的利用率证据使用，不重复用于其他维度的方向判断。
      - evidence_id: EVID_1c3dc864090cac8f4c9a9b23
        role: PRIMARY_SUPPORT
        note: 国际财务报告准则口径年报在毛利说明中列出产能利用率下降、晶圆出货下降与产品组合变动三项并列因素，构成下行阶段的利用率与盈利同向记录。
        overlap_note: 出货量与产品组合部分归属周期与结构维度承重；本维度仅取利用率分句，与成本端证据分属不同披露段落，不构成重复计分。
      - evidence_id: EVID_3154aa1a93149fb86a04d72c
        role: PRIMARY_SUPPORT
        note: 年报在风险与经营段落中陈述公司通过优化产品组合、提升利用率、精进工艺制程来增强整体盈利能力，表明利用率在公司自述的盈利机制清单中占据位置。
        overlap_note: 产品组合部分可在结构维度承重，工艺制程部分可在可持续性维度承重；本维度只援引其中的利用率一项作为机制存在性的文本依据，不构成重复计分。
      - evidence_id: EVID_ac341415e94d16e43f70b315
        role: PRIMARY_SUPPORT
        note: 较晚年度的致股东的信中记载产能利用率同比提升，与前述下行年度的利用率下降形成方向相反的两个阶段，本维度的方向在跨周期上保持一致。
        overlap_note: 同段落还提到折旧与代工地位，可在资本开支与可持续性维度承重；本维度只取利用率提升这一分句，毛利率部分另以上下文角色引用，不构成重复计分。
      - evidence_id: EVID_921e1d21d4acaffbf75b5190
        role: CONTEXT
        note: 同一封致股东的信中，毛利率同比提升与折旧大幅增长写在与利用率提升相邻的语句中，仅用于呈现两者在同一披露段落内的并存关系，不由其承担本维度方向。
        overlap_note: ''
      - evidence_id: EVID_391db1c31ad31d10c4481811
        role: CONTEXT
        note: 单季资本开支数值仅用于说明公司处于持续产能建设阶段这一背景，不是利用率或产能指标，不得作为利用率的替代量，不承担本维度方向。
        overlap_note: ''
      counter_evidence:
      - evidence_id: EVID_6e847621bd3a5e7b8471a1d6
        note: 年报陈述在持续高投入过程中毛利率承受较高折旧压力，说明盈利能力变化存在与利用率并行的另一条披露渠道，削弱把变化单独归入利用率的解释力。
      - evidence_id: EVID_e7103d2a15cefb9eaf2c7f2a
        note: 年报陈述当年集团处于高投入期、折旧较上年增加，与利用率的表述同期并存，构成对利用率单一解释的直接制衡。
      - evidence_id: EVID_3639b4225c2c0e412050cf02
        note: 季报文本显示利用率在相邻季度间存在回落与波动，而候选集内没有与之配对的同期毛利率文本，季度层面的同向关系无法在本证据集内核验。
      alternative_explanations:
      - 折旧与高投入阶段的固定成本上升，在公司披露中与利用率并列出现，可独立解释盈利能力变化的一部分。
      - 产品组合变动在成本与毛利两处说明中均与利用率并列，可能承担相当比例的解释。
      - 晶圆出货数量与平均售价变化在年报中被单独列示，属于与利用率不同的量价渠道。
      - 政府补助、汇兑与利息等非经营项目在同期报表中变动明显，可影响利润口径而与产能吸收无关。
      limitations:
      - 本维度的承重指标白名单为空，候选数值记录仅有资本开支、营业收入与营业利润，均不是利用率或产能指标，无任何数值证据承担方向。
      - 利用率与盈利指标的并列表述来自公司自身的原因说明，属于公司口径的归因，未经独立验证。
      - 证据集中的文本命题是按结构切分的分句，部分语义依赖被切走的上下文，单句可读性受限。
      - 同一披露段落内的并存关系不等同于机制强度，本证据集不支持对贡献度或弹性作任何量化陈述。
      - 中国会计准则口径与国际财务报告准则口径、年报与季报的期间与币种口径不一致，跨口径比较仅能作定性使用。
      - 经质询确认：CAS 与 IFRS 两个口径的年报表述属同一次原始披露的两种呈报，构成伪多源，不能作为独立来源一致性的依据。
      gaps:
      - 缺少可承重的利用率数值记录，无法构成利用率与毛利率的成对时间序列。
      - 缺少折旧占营业成本比重的口径，无法核验固定成本吸收这一具体机制。
      - 缺少公司对利用率、产品组合、折旧三项各自贡献度的拆分披露。
      - 缺少季度层面利用率与毛利率的同期配对披露，季度粒度的同向关系无法核验。
      management_assertions: []
- challenge_id: CH_003
  round: 1
  category: ATTRIBUTION_CAUSALITY
  target_kind: FINDING
  target_id: D3_MIX_EFFECT
  question: 本维度把公司「due to the product mix change」等原因说明列为 PRIMARY_SUPPORT。在没有独立证据的情况下，这是否把公司自身的归因升级为已验证的原因？
  disposition: RESOLVED_WITH_REVISION
  reason: 一次定向复核确认这四条记录均为公司在同一次披露中给出的原因说明，证据集内没有独立佐证。按 FR-052 保留为 MANAGEMENT_ASSERTION，移出支撑证据并重述发现。
  revision:
    dimension_id: D3_MIX_EFFECT
    finding_after:
      dimension_id: D3_MIX_EFFECT
      finding: MIXED
      finding_statement: 经质询后重述：本维度可承重的数值指标只有一条 FY2025 的 ASP_SOURCE_REPORTED（6482
        CNY），无同口径跨期可比值；应用结构占比在 2025 年报中确有可观察位移（智能手机 37.8% 升至 43.2%，消费电子 27.8% 降至 23.1%），而按尺寸划分的
        12 英寸占比在两年间基本持平。公司关于「产品结构变化」的说明已全部移入管理层表述，不再作为支撑证据。在剩余可承重证据下，结构变化与售价、成本或毛利之间的关系只能表述为同期并存，方向维持
        MIXED。
      supporting_evidence:
      - evidence_id: EVID_15431f7b706e456e0fd4ee74
        role: PRIMARY_SUPPORT
        note: 本维度白名单内唯一可承重的量化观测：FY2025（CAS 口径）ASP_SOURCE_REPORTED = 6482 CNY。它确认「售价」这一被问变量在证据集中确有可追溯的口径与数值，但为单点年度值，无上期可比数、无按制程或应用的拆分。
        overlap_note: 同一售价数据在盈利能力维度也可能被引用。此处的用途不同：本维度只把它作为「售价口径存在且被披露」的锚点，用于界定结构讨论所指向的价格变量，不用它论证利润率水平或其可持续性，不构成重复计分。
      - evidence_id: EVID_508ec4593d8212410c49cb84
        role: CONTEXT
        note: 2025 年年报按应用划分：消费电子占比 43.2%（上年 37.8%）。应用结构在报告期内存在可观测的位移。该数值在本集中标为不可承重，仅作背景。
        overlap_note: 应用占比亦可作为非主业或周期维度的背景。此处仅用于确认「结构确实发生变化」这一前提事实，不参与任何强度判断。
      - evidence_id: EVID_78340e489763db9663aa3022
        role: CONTEXT
        note: 2025 年年报按应用划分：智能手机占比 23.1%（上年 27.8%）。与消费电子占比上升方向相反，两者共同刻画应用结构位移的幅度。仅作背景。
        overlap_note: 与上一条同源，属同一张应用结构表。此处只作背景，不单独计入证据强度。
      - evidence_id: EVID_87d902958326c93773422130
        role: CONTEXT
        note: 2025 年年报按尺寸划分：12 吋占比 77.1%（上年 77.3%）。制程尺寸结构在同期基本持平，与应用结构的明显位移形成对照，提示「制程结构变化」一侧在本证据集内缺乏可观测位移。
        overlap_note: 尺寸结构数据在资本开支维度也可能被引用（产能投向）。此处仅用于说明本维度问题中「制程结构」一侧证据不足，用途不同。
      counter_evidence:
      - evidence_id: EVID_20847c93979c92b6d9eb5597
        note: 2025 年第四季度公告原文：「Gross margin was 19.2% in 4Q25, compared to 22.0% in
          3Q25, due to the increase in depreciation.」。该期毛利率下降的说明中并未列入产品结构变化，只列折旧一项，结构并非各期毛利变动说明的稳定组成项。
      - evidence_id: EVID_6e847621bd3a5e7b8471a1d6
        note: 2023 年年报：「During the process of continuous high investments, the Company's
          gross margin is under the pressure of high depreciation」。公司披露的这句话把折旧单独点名为毛利承压来源，构成与结构解释并行的替代路径。
      - evidence_id: EVID_f943e43f546a2e5fa8c716e3
        note: 2025 年第四季度公告：「growth was mainly due to the increase in wafer shipment
          and product mix change in 4Q25.」。同一季度中，结构变化出现在收入增长的说明里，而同期毛利率下降的说明中未提结构；两处表述指向不一致，削弱了「结构—毛利」的单一方向读法。
      alternative_explanations:
      - 折旧规模上升：多期说明中折旧被单独或并列列为成本与毛利变动来源，在不涉及结构变化的情况下即可解释毛利率波动。
      - 产能利用率与出货量变化：2025 与 2023 年年报的毛利说明均把利用率、出货量与结构并列，规模效应本身足以解释同方向的毛利变动。
      - 会计口径与币种差异：唯一承重的售价观测为 CAS 口径人民币年度值，而毛利率与成本观测多为 IFRS 口径美元季度值，口径差异本身即可产生表观上的不一致。
      - 行业与需求端因素：年报行业段落提到存储需求挤压其他应用供给、终端价格与需求变化等外部条件，这些条件在结构解释之外亦与售价和成本相关。
      limitations:
      - 本维度白名单仅含 ASP_SOURCE_REPORTED，且集内仅有一条可承重记录（FY2025，6482 CNY）；其余数值均标记 bearing=NO，只能以
        CONTEXT 角色引用，量化骨架实际上是单点数据，无同口径上期可比值。
      - 结论主要依赖文本命题而非数值证据；文本中「product mix change」始终与出货量、产能利用率、折旧并列出现，证据集内不存在把结构效应单独量化或分离的披露。
      - 集内所有条目均为公司自身披露（年报与季度业绩公告），不含独立第三方对结构与售价关系的核验材料。
      - 「制程结构」一侧证据薄弱：按尺寸划分的占比在 2025 与 2024 年间几乎持平，集内亦无按制程节点的收入、成本或毛利拆分。
      - 各期表述方向不一致（4Q25 毛利率变动说明未提结构，1Q26 则提及），跨期稳定的关系无法在本证据集内建立。
      - 经质询确认：公司自身的「产品结构变化」归因语句在证据集内没有独立佐证，已保留为管理层表述而非验证后的原因。
      gaps:
      - 缺少按制程节点或按应用划分的售价、单位成本或毛利率拆分数据。
      - 缺少可比期的 ASP 观测（同口径上期值），售价变化幅度无法计算。
      - 缺少把结构效应与出货量、产能利用率、折旧分离的量化归因披露（如结构、价格、量的分解表）。
      - 缺少独立第三方对制程与应用结构变化及其价格影响的核验材料。
      management_assertions:
      - evidence_id: EVID_e4b206094f5890f4cf04ffc1
        statement: 公司在该次披露中把产品结构变化列为毛利率或平均售价变动的说明之一；本阶段保留为公司具名表述，不作独立确认。
      - evidence_id: EVID_c2538a34f11c5131292d1fe8
        statement: 公司在该次披露中把产品结构变化列为毛利率或平均售价变动的说明之一；本阶段保留为公司具名表述，不作独立确认。
      - evidence_id: EVID_43289a6874cc99aca0fa341c
        statement: 公司在该次披露中把产品结构变化列为毛利率或平均售价变动的说明之一；本阶段保留为公司具名表述，不作独立确认。
      - evidence_id: EVID_1c3dc864090cac8f4c9a9b23
        statement: 公司在该次披露中把产品结构变化列为毛利率或平均售价变动的说明之一；本阶段保留为公司具名表述，不作独立确认。
- challenge_id: CH_004
  round: 1
  category: ACCOUNTING_COMPARABILITY
  target_kind: EVIDENCE
  target_id: EVID_28c333bb3006b183a5e34b57
  question: 该折旧记录来源为半年度材料却被标注为 FISCAL_YEAR 2025 全年，且同一 DEPRECIATION_EXPENSE 指标在候选集内同时存在百分比型与金额型取值。它是否可比、是否已污染
    D4 的折旧压力判断？
  disposition: RESOLVED_NO_CHANGE
  reason: 一次定向复核确认该记录及同类折旧记录均未进入 D4 的支撑证据，仅在限制中披露；D4 的证据分来自 CAPITAL_EXPENDITURE_INCURRED
    的跨期可比值。上游期间标注缺陷已由 04 阶段的 GAP_EVIDENCE_UPSTREAM_PERIOD_MISLABEL 承接，本阶段不重复登记。
- challenge_id: CH_005
  round: 2
  category: FALSIFICATION_MISSING_EVIDENCE
  target_kind: FINDING
  target_id: D7_SUSTAINABILITY_EVIDENCE
  follow_up_of: CH_001
  question: 可持续性判断缺少任何经营现金流证据：候选集内 18 条数值全部是结果指标，承重指标白名单为空。在没有现金流或单位成本证据的情况下，MIXED
    的方向能否成立？
  disposition: UNRESOLVED_DOWNGRADED
  reason: 一次定向复核确认冻结快照内存在 NET_CASH_FROM_OPERATING_ACTIVITIES 记录，但无一被冻结的 D7 查询族命中，因而不在本维度候选集内；03
    查询族已冻结，本阶段不得改动。两轮内无法在候选集内取得可承重证据，按固定阶梯降级。
