dimension_id: D4_CAPEX_CONVERSION
finding: MIXED
finding_statement: >-
  在候选证据集内，公司季度资本开支自2025Q2至2025Q4维持在较高水平（1,885.1、2,394.2、2,407.5百万美元），2026Q1回落至1,562.8百万美元；
  与此同时，可观察的产能与出货口径同步走高：月产能从2025Q4的1,058,750片标准逻辑8英寸约当晶圆继续上行，2025年末月产能约1,059千片较上年末增加，
  2025年收入同比增长16.2%至9,327百万美元。上述量价与产能指标与持续的资本开支在同一期间并行出现，可以说明支出规模与可观察产能、出货、收入呈现同向变动，
  但候选集内没有任何单位产能投资额、新增产能爬坡节奏、分厂/分制程收入归属或增量投资回报的口径，无法将收入与产能的变化归因于特定期间的资本开支。
  折旧压力一侧更弱：候选集中标注为承重指标的折旧记录全部来自同一半年度来源组却被标为整个财年，且同时存在百分比与金额、正值与负值混排的记录，
  数值互不自洽，不能据以刻画折旧对利润的实际压力。综合来看，"支出与可观察产能、出货、收入同向"这一半可由证据支持，
  "折旧压力如何"这一半在本候选集内不可回答，故整体判定为 MIXED。
supporting_evidence:
  - evidence_id: EVID_b6ca12760465cf1f85ac2132
    role: PRIMARY_SUPPORT
    note: 2025Q2 资本开支 1,885.1 百万美元，构成本维度支出强度时间序列的起点。
    overlap_note: >-
      同一资本开支数字也出现在 D2（盈利/成本结构）候选集中，在那里它被用于观察折旧与毛利的成本侧含义；
      此处仅把它当作"投入规模"的时间序列输入，用来与产能、出货口径做同期对照，不重复承担盈利结论的权重，故非重复计数。
  - evidence_id: EVID_64b7b6e55bf09b1bd6d6a983
    role: PRIMARY_SUPPORT
    note: 2025Q3 资本开支 2,394.2 百万美元，较上一季度上行。
    overlap_note: >-
      该数字与 D2 候选集重叠，也可能与产能利用率维度相关；本处只用其季度环比水平变化刻画投入节奏，
      不用于推断毛利率或利用率结论，避免在两个维度同时充当承重结论的依据。
  - evidence_id: EVID_506c9008573e9b29806e0917
    role: PRIMARY_SUPPORT
    note: 2025Q4 资本开支 2,407.5 百万美元，全年维持高位。
    overlap_note: >-
      同一季度资本开支在 D2 中作为成本与折旧基数的前置输入出现；在本维度它仅回答"支出是否持续"，
      而不回答"支出是否改善盈利"，两处使用的结论指向不同，不构成双重计数。
  - evidence_id: EVID_39fad64e2bfafa430372af35
    role: PRIMARY_SUPPORT
    note: 2026Q1 资本开支 1,562.8 百万美元，较2025Q4明显回落，说明投入节奏并非单向上行。
    overlap_note: >-
      该数字同样进入 D2 与周期性维度的候选集；此处用于刻画投入的期间波动，属于本维度问题的直接对象，
      而周期维度关注的是需求侧节奏，两者的承重对象不同，故非重复使用。
  - evidence_id: EVID_e74c8dc24d64d1c54207c161
    role: CONTEXT
    note: 4Q25 月产能升至 1,058,750 片标准逻辑8英寸约当晶圆，为同期可观察的产能口径。
    overlap_note: 产能指标同时属于利用率维度；此处仅作为背景对照，不承担本维度方向。
  - evidence_id: EVID_b3be960651e4a865e67edf78
    role: CONTEXT
    note: 2025年末月产能约 1,059 千片标准逻辑8英寸约当晶圆，较上年末增加。
    overlap_note: 与利用率、产能扩张维度共享，此处仅为背景，不承重。
  - evidence_id: EVID_eb92a4da2d3d97b5b80eb6bf
    role: CONTEXT
    note: 2025年收入同比增长16.2%至 9,327 百万美元，与同期持续的资本开支并行出现。
    overlap_note: 收入增速属于成长与盈利维度的承重口径，此处仅作同期并列的背景观察，不用其推断投入回报。
  - evidence_id: EVID_73fb997b13c8db486f7293ce
    role: CONTEXT
    note: 2025年年报披露，报告期内大部分资本开支用于产能扩张，说明支出用途的自述口径。
    overlap_note: 该表述也可服务于战略与可持续性维度；此处仅用作支出用途的定性背景，不作为产能或收入结果的依据。
counter_evidence:
  - evidence_id: EVID_3639b4225c2c0e412050cf02
    note: 1Q26 产能利用率降至 93.1%（4Q25 为 95.7%），在月产能继续上行的同期出现，说明新增产能未被同比例消化。
  - evidence_id: EVID_f4043f182aabc51a9d04505c
    note: 1Q26 晶圆出货 2,509,137 片，环比 -0.2%，与同期产能扩张方向不一致。
  - evidence_id: EVID_3f86d2cc1b762cdd4d777208
    note: 年报风险章节列示资产减值风险条目，提示重资产投入在资产端存在潜在减值敞口。
alternative_explanations:
  - 收入与出货的同期上行可能主要来自下游需求与产品结构变化，而非本期资本开支所形成的新增产能。
  - 产能口径的上行可能包含前期（2023—2024年）投入在本期完工转固的部分，与本期支出的期间对应关系无法从候选集中分离。
  - 2026Q1 资本开支回落可能仅反映设备交付与付款的时点分布，而非投入强度的实质变化。
  - 收入增长与产能扩张同期出现，也可能同时受行业本地化替代等外部环境因素影响，候选集不含可区分这两者的口径。
limitations:
  - 候选集中被标为承重指标的折旧记录（如 EVID_28c333bb3006b183a5e34b57、EVID_12b2fee4fb7d5c9af0453f08）均来自 SG_SMIC_2025_H1 来源组却被标注为 FISCAL_YEAR 2025 全年，存在已知的期间标注缺陷，不能据以计算折旧压力。
  - 同一 DEPRECIATION_EXPENSE 指标下同时存在百分比型（如 20、-10、33、5）与金额型（如 12591292、17418192、10959127）记录，量纲与符号互不自洽，数值不可用于任何折旧水平或折旧率推断。
  - CAPITAL_EXPENDITURE_INCURRED 存在明显异常记录，如 EVID_c8f346e6274da4b8081b8cbf 与 EVID_f0a136a096fb7ca516f1d011 均为 -3 CNY 的年度值，属实现缺陷，本判断未据其推理。
  - 部分季度资本开支记录的期间标签与数值不一致（例如 EVID_92440a787b18fafed9a2e2a5 将 2,394.2 标为 2025Q4、EVID_cdd47d44bf7d8de27c3e8a0d 将 1,885.1 标为 2025Q3），本判断以各季度公告原文中与季度直接对应的数值为准。
  - 资本开支为美元 IFRS 口径，折旧记录为人民币 CAS 口径，候选集内没有可用于跨口径对照的桥接记录。
gaps:
  - 缺少可用的折旧费用绝对额与折旧率时间序列，无法回答问题中"折旧压力"的一半。
  - 缺少单位新增产能对应的资本开支口径，无法衡量投入效率。
  - 缺少分厂、分制程或分节点的收入与产能归属数据，无法把产能增量与收入增量对应起来。
  - 缺少在建工程转固、固定资产原值与净值的期间明细，无法观察支出向可折旧资产的落地节奏。
management_assertions: []
