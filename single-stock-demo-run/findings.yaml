  - 唯一的机制性披露为年报模板化语句，2024 与 2025 两版措辞高度重合，未提供产品结构、价格、单位成本、费用率等可核验拆分。
  - 候选集内同一期间存在多条数值不一致的销售成本记录（如 2025 年 Q3 期间同时出现 1859.0 与 1759.3 百万美元），跨期毛利桥的自行推算不具可靠性，故未进行。
  - 候选文本大量为年报风险章节与业务模式章节的切片，句子被截断，语义完整性有限，不宜据以做因果推断。
  - 前瞻性指引材料只能作为具名公司陈述记录，不能用于支撑或反驳本维度结论。
  gaps:
