- dimension_id: D7_SUSTAINABILITY_EVIDENCE
  finding: MIXED
  finding_statement: 在本维度的封闭候选证据集中，盈利能力改善本身在时间与口径上具有一定的可观察性：2025 年全年收入同比增长 16.2%、毛利率提升
    3.0 个百分点至 21.0%，2024 年全年收入同比增长 27.0%，同期年化产能利用率提升 8 个百分点至 93.5%，第四季度产能利用率为 95.7%；季度层面
    2025 年 Q2 至 Q4 毛利率依次为 20.4%、22.0%、19.2%，第四季度环比回落。 但必须说明：本维度的承重指标白名单为空，上述收入、销售成本、毛利与毛利率均属结果性指标，用结果证明结果本身可持续属于循环论证，
    故它们在本判断中仅作为背景信息引用，不承担支撑重量。真正指向经营机制的披露仅有年报中「通过优化产品组合、提高产能利用率、精进工艺 提升整体盈利能力」这一句，2024
    与 2025 两版年报措辞几乎一致，属于通用性机制表述，未附带可核验的产品结构、价格、单位成本或费用拆分数据； 与此同时公司在风险章节反复提示业绩波动、毛利率波动、资产减值与持续大额资本开支压力。快照中存在经营活动现金流记录，但本维度冻结的检索族
    未将其取回，故无法在本证据集内做现金流与利润的交叉验证。综合而言，改善事实可跨期、跨结果指标观察到，但「有经营机制支持且可持续」这一 命题在当前证据集内未获得可承重的独立验证，故判定为
    MIXED。
