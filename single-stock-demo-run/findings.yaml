    中国企业会计准则口径下，计入当期损益的政府补助 2023 年为 1,677,347 千元，2024 年为 1,333,945 千元，2025 年为 1,582,524
    千元， 呈现先降后升的波动；国际财务报告准则口径的非经常性损益披露中，政府补助 2025 年为 222,637 千美元、2024 年为 187,686 千美元、
    2023 年为 236,425 千美元，同期非经常性损益合计分别为 109,575、123,818、436,563 千美元，而当年利润分别为 988,944
    与 729,993 千美元， 可见补助规模与利润规模处于同一数量级，非核心项目在报表利润中占有可观份额。 与此同时，年报披露该期间息税折旧摊销前利润及其利润率的变化主要与晶圆出货量、产能利用率与产品结构相关，
