  alternative_explanations:
  - 结果指标改善可能与行业周期上行同步：年报披露 2024 年半导体市场呈复苏态势、2025 年行业延续增长，周期性因素与公司内部机制在本证据集内无法区分。
  - 改善可能伴随产能规模扩张与出货量增长（全年出货约 970 万片、年末产能约 105.9 万片 8 英寸当量），属规模效应而非单位盈利结构的改善。
  - 毛利率变化可能与产能利用率的高位运行同步，而高利用率本身可能是需求侧短期状态，不必然对应长期机制。
  - 会计口径与期间划分（IFRS 单季数据、快照内同一期间存在多条口径不同的销售成本记录）也可能影响跨期比较的表观改善幅度。
