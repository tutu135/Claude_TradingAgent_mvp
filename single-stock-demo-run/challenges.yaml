      2025 年 Q2 至 Q4 毛利率依次为 20.4%、22.0%、19.2%，第四季度环比回落。 但必须说明：本维度的承重指标白名单为空，上述收入、销售成本、毛利与毛利率均属结果性指标，用结果证明结果本身可持续属于循环论证，
