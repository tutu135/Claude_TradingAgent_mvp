- challenge_id: CH_003
  round: 1
  category: ATTRIBUTION_CAUSALITY
  target_kind: FINDING
  target_id: D3_MIX_EFFECT
  question: 本维度把公司「due to the product mix change」等原因说明列为 PRIMARY_SUPPORT。在没有独立证据的情况下，这是否把公司自身的归因升级为已验证的原因？
  follow_up_of: null
  review_count: 1
  disposition: RESOLVED_WITH_REVISION
  reason: 一次定向复核确认这四条记录均为公司在同一次披露中给出的原因说明，证据集内没有独立佐证。按 FR-052 保留为 MANAGEMENT_ASSERTION，移出支撑证据并重述发现。
  schema_errors: []
  blocking_triggers: []
  finding_before:
    dimension_id: D3_MIX_EFFECT
    finding: MIXED
    finding_statement: 候选证据集中，公司在多个报告期的经营讨论里反复把「产品结构变化（product mix change）」与晶圆出货量、产能利用率、折旧并列，写在营收、销售成本与毛利变动的说明清单中：2025
      年年报的毛利变动说明里，出货量增加、产能利用率提升与产品结构变化三项并列出现；2023 年年报的毛利下滑说明里，产能利用率下降、出货量下降与产品结构变化同样并列出现；2026
      年第一季度公告则把毛利率由 19.2% 到 20.1% 的变化与产品结构变化、平均售价上升写在同一句表述内。应用结构方面，2025 年年报按应用划分的收入占比显示消费电子由
      37.8% 升至 43.2%、智能手机由 27.8% 降至 23.1%，同期按尺寸划分的 12 吋占比基本持平（77.3% 对 77.1%），结构位移集中在应用维度而非制程尺寸维度。但本维度可承重的量化指标只有一条：FY2025
      的 ASP_SOURCE_REPORTED = 6482 CNY，既无上一期可比值，也无按制程或应用拆分的售价、成本、毛利数据。在本证据集内，结构变化与出货量、产能利用率、折旧等同时出现的因素无法分离，量化归因不可得。结论是：存在多期、方向一致的文本证据表明结构变化被公司列为售价与毛利变动说明中的相关项之一，同时缺乏可量化、可分离的承重数据，判定为
      MIXED 而非 SUPPORTED。
