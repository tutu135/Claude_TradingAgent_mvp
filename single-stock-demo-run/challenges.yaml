      threshold: UNKNOWN
      threshold_basis: UNKNOWN
      basis_evidence_id: null
    - indicator: 年报披露的盈利机制表述是否附带分项数据（产品组合、单价、单位成本拆分）
      judgment_logic: 若后续年报仍仅重复「优化产品组合、提高产能利用率、精进工艺」的通用表述而无可核验拆分，则机制层面的证据缺口保持不变， 本维度不应上调；若出现分项披露且与毛利变动方向一致，则可支持上调。
      threshold: UNKNOWN
      threshold_basis: UNKNOWN
      basis_evidence_id: null
    - indicator: 资本开支规模与固定资产减值/存货跌价相关披露
      judgment_logic: 公司披露 2025 年资本开支为 81 亿美元并提示折旧负担与资产减值风险；若后续期间出现减值计提或折旧压力披露扩大，
        同时毛利率走弱，则可持续性判断应下调。
      threshold: UNKNOWN
      threshold_basis: UNKNOWN
      basis_evidence_id: null
